  title: "Dumb Posh Hippies & Freak Pointing & Eyecum"

- key: "20261113"
  redirect_to: "https://www.bandsintown.com/e/108958389"
  title: "Dash & Grey City Riot & Freak Pointing & The Dead Weeds"
  
- key: "20261031"
  redirect_to: "https://ie.powertik.com/events/spooky-season-2-halloween-festival-day-2?mpl=freakpointing"
  title: "Day 2 - Spooky Season 2 [Halloween Festival]"

